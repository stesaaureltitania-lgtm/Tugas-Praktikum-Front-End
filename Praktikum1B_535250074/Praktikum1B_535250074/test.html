 <!-- Ini kode modif dari  06.02. Table with Heading saat penambahan poin (pas di run yang ini ada tambahan 1 kolom baru yaitu gender) -->
 <!DOCTYPE html> 
<html>
<head>
    <title>Document</title>
</head>
<body>
    <h1>Table with Heading</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
            <th>Gender</th>
        </tr>

        <tr>
            <td>John</td>
            <td>25</td>
            <td>New York</td>
            <td>Male</td>
        </tr>

        <tr>
            <td>Jane</td>
            <td>30</td>
            <td>London</td>
            <td>Female</td>
        </tr>

    </table>
</body>
</html>
