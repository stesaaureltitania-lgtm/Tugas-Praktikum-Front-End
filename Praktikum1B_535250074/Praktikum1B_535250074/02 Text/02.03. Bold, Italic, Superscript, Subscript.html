<!DOCTYPE html>
<html>
<head>
    <title>Bold, Italic, Superscript, Subscript</title>
</head>
<body>
    <h1>Text Formatting Examples</h1>
    <p>This is <b>bold</b> text.</p>
    <p>This is <i>italic</i> text.</p>
    <p>This is <sup>superscript</sup> text (e.g., 2<sup>2</sup>).</p>
    <p>This is <sub>subscript</sub> text (e.g., H<sub>2</sub>O).</p>
</body>
</html>
